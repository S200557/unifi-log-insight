name: Snyk Container

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.jsx'
      - '**.js'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - '.github/workflows/snyk-container.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.jsx'
      - '**.js'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - '.github/workflows/snyk-container.yml'
  schedule:
    - cron: '30 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    name: Check Snyk configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check optional Snyk token
        id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Snyk is not configured: SNYK_TOKEN is absent. No vulnerability scan was performed.'
            echo 'Snyk scan skipped because the optional SNYK_TOKEN repository secret is not configured. No vulnerability scan was performed. Add the secret to enable scanning; application tests are independent.' >> "$GITHUB_STEP_SUMMARY"
          fi

  snyk:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build a Docker image
        run: docker build -t unifi-log-insight:latest .

      - name: Run Snyk to check Docker image for vulnerabilities
        continue-on-error: true
        uses: snyk/actions/docker@14818c4695ecc4045f33c9cee9e795a788711ca4
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: unifi-log-insight:latest
          args: --file=Dockerfile --sarif-file-output=snyk.sarif

      - name: Require a security report from the configured scan
        run: |
          if [ ! -s snyk.sarif ]; then
            echo '::error::Snyk did not produce snyk.sarif. Check the preceding scan output and SNYK_TOKEN configuration.'
            exit 1
          fi

      - name: Fix Snyk SARIF null severity values
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('snyk.sarif')
          data = json.loads(report.read_text())
          for run in data.get('runs', []):
              for rule in run.get('tool', {}).get('driver', {}).get('rules', []):
                  props = rule.get('properties', {})
                  if 'security-severity' in props and props['security-severity'] in (None, 'null'):
                      props['security-severity'] = '0'
          report.write_text(json.dumps(data))
          PY

      - name: Upload result to GitHub Code Scanning
        if: hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
